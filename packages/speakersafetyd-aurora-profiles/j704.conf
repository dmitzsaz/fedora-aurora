# MacBook Pro 14-inch M5 (J704).
#
# This is speakersafetyd's j504.conf (AsahiLinux/speakersafetyd 615674e7,
# unchanged since speakersafetyd 3.0.0), with every value unchanged. The
# J704 speakers have the J504's layout, six SN012776 amps driving two
# woofer pairs and two tweeters, and the speaker-protection tuning macOS
# carries for the J704 (acoustic ID 39, its spp3 strip) has the same
# per-channel thermal model and sense scaling as j504.conf: the OL_thermal
# coil and magnet settling temperatures and time constants, temperature
# limits and headroom, the 3.2 ohm reference resistance and 0.09 ohm
# shunt, the CL temperature coefficients at 20 and 35 C, and the 3.75 and
# 14 IMON/VMON scales, woofers and tweeters alike.
#
# The sense layout is the J504's too. The J704 amps report in the order
# the machine lists them: left woofer 1, right woofer 1, left woofer 2,
# right woofer 2, left tweeter, right tweeter. Amp n sends its current on
# 16-bit channel 2n and its voltage on 2n+1 (ti,imon-slot-no 4n and
# ti,vmon-slot-no 4n+2 in the device tree, in 8-bit units).

[Globals]
visense_pcm = 2
t_ambient = 50.0
t_hysteresis = 5.0
t_window = 20.0
channels = 12
period = 4096
link_gains = True
uclamp_max = 64

[Controls]
vsense = VSENSE Switch
isense = ISENSE Switch
amp_gain = Amp Gain Volume
volume = Speaker Volume

[Speaker/Left Woofer 1]
group = 1
tr_coil = 28.09
tr_magnet = 34.43
tau_coil = 3.05
tau_magnet = 192.45
t_limit = 130.0
t_headroom = 10.0
z_nominal = 3.20
z_shunt = 0.09
a_t_20c = 0.00383214
a_t_35c = 0.00362404
is_scale = 3.75
vs_scale = 14
is_chan = 0
vs_chan = 1

